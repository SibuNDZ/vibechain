name: Deploy Solana Programs

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: 'Solana cluster to deploy to'
        required: true
        default: 'devnet'
        type: choice
        options:
          - devnet
          - mainnet

env:
  PNPM_VERSION: '9'
  NODE_VERSION: '20'
  ANCHOR_VERSION: '0.30.1'

jobs:
  deploy:
    name: Deploy Solana Programs
    runs-on: ubuntu-latest
    environment: ${{ inputs.cluster }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: cargo install --git https://github.com/coral-xyz/anchor avm --locked --force && avm install ${{ env.ANCHOR_VERSION }} && avm use ${{ env.ANCHOR_VERSION }}

      - name: Setup Solana keypair
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_KEYPAIR }}' > ~/.config/solana/id.json
          solana config set --url ${{ inputs.cluster == 'mainnet' && 'mainnet-beta' || 'devnet' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build programs
        working-directory: packages/contracts
        run: anchor build

      - name: Run tests
        working-directory: packages/contracts
        run: anchor test --skip-local-validator
        env:
          ANCHOR_PROVIDER_URL: ${{ inputs.cluster == 'mainnet' && secrets.SOLANA_RPC_URL || 'https://api.devnet.solana.com' }}

      - name: Deploy programs
        working-directory: packages/contracts
        run: |
          anchor deploy --provider.cluster ${{ inputs.cluster == 'mainnet' && 'mainnet' || 'devnet' }}
        env:
          ANCHOR_WALLET: ~/.config/solana/id.json

      - name: Summary
        run: |
          echo "## Solana Program Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster:** ${{ inputs.cluster }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for deployed program IDs." >> $GITHUB_STEP_SUMMARY
