[package]
name = "vibe-voting"
version = "0.1.0"
description = "VibeChain voting program for Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vibe_voting"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
